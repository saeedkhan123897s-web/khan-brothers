<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b0b0b">
    <title>Khan Brothers | Motorcycle Business</title>
    <link rel="icon" href="/kb.png" type="image/png">
    <link rel="stylesheet" href="/style.css">
    <script src="/i18n.js" defer></script>
    <script src="/notifications.js" defer></script>
    <script src="/daily-chart.js" defer></script>
    <script src="/operations.js" defer></script>
    <script src="/business-pages.js" defer></script>
    <script src="/kb-loader.js" defer></script>
    <script src="/app.js" defer></script>
</head>
<body data-loader-logo="/kb.png">
    <main id="signIn" class="sign-in" hidden>
        <form id="loginForm" class="panel">
            <img src="/kb.png" alt="Khan Brothers" width="64" height="64">
            <h1>Staff sign-in</h1>
            <div class="actions">
                <button type="button" class="theme-toggle" aria-pressed="false">☀ Light</button>
                <select class="language" aria-label="Language"><option value="en">EN</option><option value="ur">اردو</option><option value="roman">Roman Urdu</option></select>
            </div>
            <label>Username<input name="username" value="admin" autocomplete="username" required maxlength="40"></label>
            <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
            <label id="loginCode" hidden>Authenticator or recovery code<input name="code" autocomplete="one-time-code" maxlength="24"></label>
            <button class="primary" type="submit">Sign in</button>
            <p id="loginStatus" class="notice" role="status"></p>
        </form>
    </main>
    <div id="workspace" class="workspace" hidden>
        <button type="button" id="drawerBackdrop" class="drawer-backdrop" aria-label="Close navigation" tabindex="-1" hidden></button>
        <aside id="sidebar" class="sidebar" aria-label="Main sidebar">
            <a class="brand" href="#dashboard"><img src="/kb.png" alt="" width="46" height="46"><span>Khan Brothers</span></a>
            <nav id="navigation" aria-label="Main navigation"></nav>
            <button type="button" id="signOut" class="sign-out">Sign out <span aria-hidden="true">↪</span></button>
            <div class="resize" role="separator" tabindex="0" aria-label="Resize sidebar" aria-orientation="vertical"
                aria-valuemin="178" aria-valuemax="392" aria-valuenow="232"></div>
        </aside>
        <div id="pageRegion" class="page-region">
            <header class="topbar">
                <button type="button" id="menuToggle" class="menu-toggle" aria-controls="sidebar" aria-expanded="true" aria-label="Toggle navigation">☰</button>
                <span id="breadcrumb">Dashboard</span>
                <div id="toolbar" class="toolbar">
                    <span id="lastUpdated" class="last-updated" data-verbatim></span>
                    <button type="button" id="refresh" class="refresh" aria-label="Refresh data" title="Refresh data"><span aria-hidden="true">⟳</span></button>
                    <button type="button" id="notificationBell" class="notification-bell" aria-label="Notifications"
                        aria-controls="notificationPanel" aria-expanded="false"><span aria-hidden="true">🔔</span>
                        <span id="notificationCount" class="notification-count" data-verbatim hidden></span></button>
                    <button type="button" class="theme-toggle" aria-pressed="false">☀ Light</button>
                    <select class="language" aria-label="Language"><option value="en">EN</option><option value="ur">اردو</option><option value="roman">Roman Urdu</option></select>
                    <section id="notificationPanel" class="notification-panel" aria-labelledby="notificationHeading" hidden>
                        <h2 id="notificationHeading">Notifications</h2>
                        <p id="notificationStatus" class="notice" role="status"></p>
                        <ul id="notificationList" class="notification-list"></ul>
                    </section>
                </div>
            </header>
            <main class="content" id="mainContent">
                <p id="status" class="notice" role="status"></p>
                <div id="view"></div>
            </main>
        </div>
    </div>
    <dialog id="receipt" aria-labelledby="receiptTitle">
        <header><h2 id="receiptTitle">Sale receipt</h2><form method="dialog"><button type="submit">Close</button></form></header>
        <div id="receiptBody"></div>
    </dialog>
</body>
</html>
